<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK Biodiversity OG Image Preview</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 40px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Outfit', sans-serif;
        }

        /* 模擬 OG 圖片容器 (1200x630) */
        .og-container {
            width: 1200px;
            height: 630px;
            background: white;
            box-shadow: 0 50px 100px -20px rgba(0,0,0,0.15);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px;
            box-sizing: border-box;
        }

        /* 漸層裝飾背景 */
        .bg-ball-1 {
            position: absolute;
            top: -150px;
            right: -100px;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, rgba(255,255,255,0) 70%);
        }

        .bg-ball-2 {
            position: absolute;
            bottom: -100px;
            left: -150px;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.06) 0%, rgba(255,255,255,0) 70%);
        }

        /* Logo 區域 */
        .logo-wrapper {
            width: 420px;
            height: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }

        .logo-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* 文字內容 */
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
        }

        .title {
            font-size: 64px;
            font-weight: 900;
            color: #0f172a;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin: 0;
        }

        .chinese-title {
            font-size: 42px;
            font-weight: 700;
            color: #475569;
            letter-spacing: 0.15em;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 26px;
            color: #94a3b8;
            font-weight: 500;
            letter-spacing: 0.02em;
            border-top: 1px solid #f1f5f9;
            padding-top: 20px;
            margin-top: 10px;
            max-width: 1000px;
        }

        /* 底部裝飾 */
        .footer-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 16px;
            display: flex;
        }

        .bar-1 { flex: 1; background-color: #10b981; }
        .bar-2 { flex: 1; background-color: #0d9488; }
    </style>
</head>
<body>

    <div class="og-container">
        <div class="bg-ball-1"></div>
        <div class="bg-ball-2"></div>
        
        <div class="logo-wrapper">
            <!-- 直接從本地 public 路徑抓取 -->
            <img src="../public/logo.svg" alt="HKBC Logo">
        </div>

        <div class="content">
            <h1 class="title">Hong Kong Biodiversity Collective</h1>
            <div class="chinese-title">香港自然生態匯誌</div>
            <div class="subtitle">A collaborative biodiversity encyclopedia of Hong Kong</div>
        </div>

        <div class="footer-bar">
            <div class="bar-1"></div>
            <div class="bar-2"></div>
        </div>
    </div>

</body>
</html>
