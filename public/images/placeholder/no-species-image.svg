<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 移除固定的背景 rect，讓 SVG 變為透明，以便融入組件背景 -->
  
  <!-- 微細裝飾細節：保留線性掃描紋路，但將顏色改為更淡，以適應組件底色 -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#grid)"/>

  <!-- 核心專業圖標 -->
  <g transform="translate(160, 100)">
    <!-- 相機底盤 -->
    <rect x="0" y="5" width="80" height="55" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    
    <!-- 頂部快門按鈕區域 -->
    <path d="M25 0H55C57.2091 0 59 1.79086 59 4V5H21V4C21 1.79086 22.7909 0 25 0Z" fill="#CBD5E1"/>
    
    <!-- 鏡頭框 -->
    <circle cx="40" cy="32" r="18" fill="white" stroke="#94A3B8" stroke-width="1.5"/>
    <circle cx="40" cy="32" r="12" fill="#F1F5F9"/>
    <circle cx="43" cy="27" r="3" fill="white" fill-opacity="1"/> <!-- 高光 -->
    
    <!-- 右下角輔助加號 -->
    <g transform="translate(65, 45)">
      <circle r="10" fill="white" stroke="#94A3B8" stroke-width="1.5"/>
      <path d="M0 -4V4M-4 0H4" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
